<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liar Game – Answer & Reveal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: white;
      padding: 25px 20px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #1a2639;
      font-size: 1.8rem;
    }
    .step {
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .step.active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    .input-group input {
      flex: 1;
      padding: 10px 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      min-width: 150px;
    }
    .input-group input:focus { border-color: #4a6fa5; }
    button {
      background: #4a6fa5;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #3b5a8a; }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    button.success { background: #28a745; }
    button.success:hover { background: #218838; }

    .player-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
    }
    .player-tag {
      background: #e9ecef;
      padding: 8px 15px;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      cursor: default;
    }
    .player-tag .remove {
      cursor: pointer;
      font-weight: bold;
      color: #dc3545;
      margin-left: 4px;
    }
    .player-tag .remove:hover { color: #a71d2a; }

    /* Viewed & Answered */
    .player-tag.viewed {
      background: #c3e6cb;
    }
    .player-tag.viewed::after {
      content: " ✓";
      color: #155724;
      font-weight: bold;
    }

    /* Only clickable during view phase */
    .player-tag.clickable {
      cursor: pointer;
    }
    .player-tag.clickable:hover {
      background: #d4d8dd;
    }

    /* Reveal display */
    .result-card {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      margin: 15px 0;
    }
    .result-card .liar-name {
      font-size: 24px;
      font-weight: bold;
      color: #dc3545;
    }
    .result-card .question-compare {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 15px 0;
    }
    .result-card .q-box {
      background: white;
      padding: 12px 18px;
      border-radius: 8px;
      border-left: 5px solid #4a6fa5;
      flex: 1;
      min-width: 150px;
    }
    .result-card .q-box.liar-q {
      border-left-color: #dc3545;
    }
    .answer-reveal-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      margin: 4px 0;
      background: white;
      border-radius: 6px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .answer-reveal-item .ans-name { font-weight: 600; }
    .answer-reveal-item .ans-text { font-style: italic; }

    .mt-15 { margin-top: 15px; }
    .mt-20 { margin-top: 20px; }
    .text-center { text-align: center; }
    .flex-center { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .status-msg { font-size: 14px; color: #6c757d; margin-top: 8px; }
    .divider { border: none; border-top: 2px dashed #dee2e6; margin: 20px 0; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: white;
      padding: 30px 35px;
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .modal-box h3 { margin-bottom: 10px; }
    .modal-box .question-text {
      font-size: 20px;
      font-weight: 500;
      margin: 15px 0;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 10px;
    }
    .modal-box .answer-input-area {
      margin: 15px 0;
      text-align: left;
    }
    .modal-box .answer-input-area label {
      font-weight: 600;
      display: block;
      margin-bottom: 5px;
    }
    .modal-box .answer-input-area input {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }
    .modal-box .answer-input-area input:focus {
      border-color: #4a6fa5;
      outline: none;
    }
    .modal-box .note {
      font-size: 14px;
      color: #6c757d;
      margin: 10px 0 20px 0;
    }
    #modalSubmitBtn {
      background: #28a745;
      padding: 10px 30px;
      font-size: 16px;
      border-radius: 8px;
    }
    #modalSubmitBtn:hover { background: #218838; }

    @media (max-width: 600px) {
      .container { padding: 15px; }
      .modal-box { padding: 20px; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🕵️ Liar Game</h1>

  <!-- STEP 1: Add Players -->
  <div id="step-add" class="step active">
    <p>Enter at least 3 players.</p>
    <div class="input-group">
      <input type="text" id="playerNameInput" placeholder="Player name..." />
      <button id="addPlayerBtn">Add</button>
    </div>
    <div id="playerListContainer" class="player-list"></div>
    <div class="flex-center mt-15">
      <button id="startGameBtn" disabled>Start Game</button>
    </div>
    <div class="status-msg text-center" id="stepAddStatus"></div>
  </div>

  <!-- STEP 2: View Questions & Answer (merged) -->
  <div id="step-view" class="step">
    <p>Each player, tap your name to see your question, write your answer, and submit.</p>
    <div id="viewPlayerList" class="player-list"></div>
    <div class="flex-center mt-20">
      <button id="revealBtn" disabled class="success">🔍 Reveal</button>
    </div>
    <div class="status-msg text-center" id="stepViewStatus"></div>
  </div>

  <!-- STEP 3: Final Reveal -->
  <div id="step-reveal" class="step">
    <div id="revealContent"></div>
    <div class="flex-center mt-20">
      <button id="playAgainBtn" class="success">Play Again</button>
    </div>
  </div>
</div>

<!-- Modal: Question + Answer input -->
<div class="modal-overlay" id="questionModal">
  <div class="modal-box">
    <h3 id="modalPlayerName">👤 Player</h3>
    <div class="question-text" id="modalQuestion">Your question goes here</div>
    <div class="answer-input-area">
      <label for="modalAnswerInput">✏️ Your Answer:</label>
      <input type="text" id="modalAnswerInput" placeholder="Type your answer..." />
    </div>
    <div class="note">Do not share your question or answer with others!</div>
    <button id="modalSubmitBtn">Submit & Close</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
