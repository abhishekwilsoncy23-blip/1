<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Liar Game – Answer & Reveal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #eef2f7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    .container {
      max-width: 780px;
      width: 100%;
      background: white;
      padding: 22px 18px;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
    }
    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 18px;
      color: #1e2a41;
      letter-spacing: -0.5px;
    }
    .step {
      display: none;
      animation: fadeIn 0.25s ease;
    }
    .step.active {
      display: block;
    }
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ---- Input & Buttons ---- */
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .input-group input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #dde3ed;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      min-width: 150px;
      transition: border 0.2s;
    }
    .input-group input:focus {
      border-color: #4a6fa5;
    }
    button {
      background: #4a6fa5;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover {
      background: #3b5a8a;
    }
    button:active {
      transform: scale(0.96);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    button.success {
      background: #28a745;
    }
    button.success:hover {
      background: #1e7e34;
    }
    button.secondary {
      background: #6c757d;
    }
    button.secondary:hover {
      background: #5a6268;
    }

    /* ---- Player list (Step 1) ---- */
    .player-list {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 16px 0 10px 0;
    }
    .player-tag {
      background: #e9edf4;
      padding: 10px 18px;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 500;
      transition: background 0.15s;
    }
    .player-tag .remove {
      cursor: pointer;
      font-weight: 700;
      color: #dc3545;
      margin-left: 4px;
      font-size: 18px;
      line-height: 1;
    }
    .player-tag .remove:hover {
      color: #a71d2a;
    }

    /* ---- Step 2: Player tags (clickable) ---- */
    .player-tag.clickable {
      background: #dbe4f0;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.15s;
    }
    .player-tag.clickable:hover {
      background: #c6d3e6;
      border-color: #4a6fa5;
      transform: scale(1.02);
    }
    .player-tag.clickable:active {
      transform: scale(0.96);
    }
    /* Viewed / answered */
    .player-tag.viewed {
      background: #c3e6cb;
      border-color: #28a745;
      cursor: default;
    }
    .player-tag.viewed::after {
      content: " ✓";
      color: #155724;
      font-weight: 700;
    }

    /* ---- Status messages ---- */
    .status-msg {
      font-size: 15px;
      color: #4a5568;
      margin-top: 8px;
      text-align: center;
      min-height: 1.6em;
    }

    /* ---- Reveal card ---- */
    .result-card {
      background: #f8fafc;
      padding: 20px 18px;
      border-radius: 16px;
      margin: 16px 0;
    }
    .result-card .liar-name {
      font-size: 26px;
      font-weight: 700;
      color: #dc3545;
      margin: 4px 0 12px 0;
    }
    .result-card .question-compare {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 12px 0;
    }
    .result-card .q-box {
      background: white;
      padding: 12px 16px;
      border-radius: 10px;
      border-left: 6px solid #4a6fa5;
      flex: 1 1 180px;
      min-width: 140px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .result-card .q-box.liar-q {
      border-left-color: #dc3545;
    }
    .answer-reveal-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 14px;
      margin: 4px 0;
      background: white;
      border-radius: 8px;
      flex-wrap: wrap;
      gap: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.02);
    }
    .answer-reveal-item .ans-name {
      font-weight: 600;
    }
    .answer-reveal-item .ans-text {
      font-style: italic;
      color: #1e2a41;
    }

    /* ---- Utility ---- */
    .mt-15 { margin-top: 15px; }
    .mt-20 { margin-top: 20px; }
    .text-center { text-align: center; }
    .flex-center {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* ---- Modal ---- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 20px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal-box {
      background: white;
      padding: 30px 28px 28px 28px;
      border-radius: 24px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: modalIn 0.25s ease;
    }
    @keyframes modalIn {
      0% { opacity: 0; transform: scale(0.92) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-box h3 {
      font-size: 1.6rem;
      margin-bottom: 4px;
      color: #1e2a41;
    }
    .modal-box .question-text {
      font-size: 1.2rem;
      font-weight: 500;
      margin: 18px 0 16px 0;
      padding: 16px;
      background: #f0f4fb;
      border-radius: 14px;
      line-height: 1.4;
      color: #0b1a2e;
    }
    .modal-box .answer-input-area {
      margin: 12px 0 16px 0;
      text-align: left;
    }
    .modal-box .answer-input-area label {
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
      font-size: 0.95rem;
      color: #2d3748;
    }
    .modal-box .answer-input-area input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #dde3ed;
      border-radius: 12px;
      font-size: 18px;
      outline: none;
      transition: border 0.2s;
    }
    .modal-box .answer-input-area input:focus {
      border-color: #4a6fa5;
    }
    .modal-box .note {
      font-size: 14px;
      color: #718096;
      margin: 10px 0 20px 0;
    }
    #modalSubmitBtn {
      background: #28a745;
      padding: 12px 36px;
      font-size: 18px;
      border-radius: 30px;
      font-weight: 600;
      width: 100%;
      max-width: 220px;
    }
    #modalSubmitBtn:hover {
      background: #1e7e34;
    }

    /* ---- Responsive ---- */
    @media (max-width: 550px) {
      .container { padding: 16px 14px; }
      h1 { font-size: 1.6rem; }
      .modal-box { padding: 24px 18px; }
      .modal-box .question-text { font-size: 1.1rem; }
      .modal-box .answer-input-area input { font-size: 16px; }
      .player-tag { padding: 8px 14px; font-size: 15px; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🕵️ Liar Game</h1>

  <!-- STEP 1: Add Players -->
  <div id="step-add" class="step active">
    <p style="margin-bottom: 4px;">Add at least 3 players.</p>
    <div class="input-group">
      <input type="text" id="playerNameInput" placeholder="Player name..." />
      <button id="addPlayerBtn">Add</button>
    </div>
    <div id="playerListContainer" class="player-list"></div>
    <div class="flex-center mt-15">
      <button id="startGameBtn" disabled>Start Game</button>
    </div>
    <div class="status-msg" id="stepAddStatus"></div>
  </div>

  <!-- STEP 2: View & Answer -->
  <div id="step-view" class="step">
    <p style="margin-bottom: 6px;"><strong>Tap your name</strong> to see your question, write your answer, and submit.</p>
    <div id="viewPlayerList" class="player-list"></div>
    <div class="flex-center mt-20">
      <button id="revealBtn" disabled class="success">🔍 Reveal</button>
    </div>
    <div class="status-msg" id="stepViewStatus"></div>
  </div>

  <!-- STEP 3: Reveal -->
  <div id="step-reveal" class="step">
    <div id="revealContent"></div>
    <div class="flex-center mt-20">
      <button id="playAgainBtn" class="success">🔄 Play Again</button>
    </div>
  </div>
</div>

<!-- Modal: Question + Answer -->
<div class="modal-overlay" id="questionModal">
  <div class="modal-box">
    <h3 id="modalPlayerName">👤 Player</h3>
    <div class="question-text" id="modalQuestion">Your question</div>
    <div class="answer-input-area">
      <label for="modalAnswerInput">✏️ Your Answer:</label>
      <input type="text" id="modalAnswerInput" placeholder="Type your answer…" autocomplete="off" />
    </div>
    <div class="note">🤫 Keep it secret – do not share with others!</div>
    <button id="modalSubmitBtn">Submit & Close</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
